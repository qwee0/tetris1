<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Анимация кругов с физикой</title>
  <style>
    /* Сброс отступов и настройка холста на весь экран */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      background-size: 400% 400%;
      animation: gradientShift 20s ease infinite;
      font-family: sans-serif;
    }

    /* Анимация переливающегося фона */
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Контейнер для кругов */
    #canvas {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Стиль круга */
    .circle {
      position: absolute;
      border-radius: 50%;
      will-change: transform, opacity;
      pointer-events: none;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3),
                  0 0 40px rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div id="canvas"></div>

  <script>
    // Настройки симуляции
    const CONFIG = {
      circleCount: 15,              // Количество кругов
      minRadius: 20,                // Минимальный радиус
      maxRadius: 50,                // Максимальный радиус
      minSpeed: 0.5,                // Минимальная скорость
      maxSpeed: 2,                  // Максимальная скорость
      damping: 0.99,                // Затухание скорости (трение)
      elasticity: 0.9,              // Упругость отскока от стен
      collisionElasticity: 0.95,    // Упругость столкновений между кругами
      glowIntensity: 0.4            // Интенсивность свечения
    };

    // Пастельные неоновые цвета
    const colors = [
      'rgba(255, 183, 197, 0.6)',   // Розовый
      'rgba(183, 255, 207, 0.6)',   // Мятный
      'rgba(183, 221, 255, 0.6)',   // Голубой
      'rgba(255, 223, 183, 0.6)',   // Персиковый
      'rgba(221, 183, 255, 0.6)',   // Лавандовый
      'rgba(255, 255, 183, 0.6)',   // Лимонный
      'rgba(183, 255, 243, 0.6)'    // Бирюзовый
    ];

    class Circle {
      constructor(x, y, radius, color) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.color = color;
        
        // Случайное направление скорости
        const angle = Math.random() * Math.PI * 2;
        const speed = CONFIG.minSpeed + Math.random() * (CONFIG.maxSpeed - CONFIG.minSpeed);
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        
        // Создаём DOM-элемент
        this.element = document.createElement('div');
        this.element.className = 'circle';
        this.element.style.width = `${radius * 2}px`;
        this.element.style.height = `${radius * 2}px`;
        this.element.style.backgroundColor = color;
        this.element.style.opacity = '0.6';
        
        document.getElementById('canvas').appendChild(this.element);
      }

      // Обновление позиции
      update(width, height) {
        // Применяем скорость
        this.x += this.vx;
        this.y += this.vy;

        // Отскок от стен
        if (this.x - this.radius <= 0) {
          this.x = this.radius;
          this.vx = -this.vx * CONFIG.elasticity;
        } else if (this.x + this.radius >= width) {
          this.x = width - this.radius;
          this.vx = -this.vx * CONFIG.elasticity;
        }

        if (this.y - this.radius <= 0) {
          this.y = this.radius;
          this.vy = -this.vy * CONFIG.elasticity;
        } else if (this.y + this.radius >= height) {
          this.y = height - this.radius;
          this.vy = -this.vy * CONFIG.elasticity;
        }

        // Применяем трение
        this.vx *= CONFIG.damping;
        this.vy *= CONFIG.damping;

        // Минимальная скорость чтобы не останавливались полностью
        const minVel = 0.1;
        if (Math.abs(this.vx) < minVel && Math.abs(this.vy) < minVel) {
          const angle = Math.random() * Math.PI * 2;
          const speed = CONFIG.minSpeed;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
        }

        // Рендеринг через transform для производительности
        this.element.style.transform = `translate(${this.x - this.radius}px, ${this.y - this.radius}px)`;
      }
    }

    // Проверка и обработка столкновений между кругами
    function handleCollisions(circles) {
      for (let i = 0; i < circles.length; i++) {
        for (let j = i + 1; j < circles.length; j++) {
          const c1 = circles[i];
          const c2 = circles[j];

          const dx = c2.x - c1.x;
          const dy = c2.y - c1.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          const minDist = c1.radius + c2.radius;

          // Если круги пересекаются
          if (distance < minDist) {
            // Нормализуем вектор столкновения
            const nx = dx / distance;
            const ny = dy / distance;

            // Относительная скорость
            const dvx = c2.vx - c1.vx;
            const dvy = c2.vy - c1.vy;

            // Скалярное произведение скорости и нормали
            const dvn = dvx * nx + dvy * ny;

            // Если круги движутся друг к другу
            if (dvn < 0) {
              // Импульс столкновения
              const impulse = -(1 + CONFIG.collisionElasticity) * dvn / 2;

              // Применяем импульс
              c1.vx -= impulse * nx;
              c1.vy -= impulse * ny;
              c2.vx += impulse * nx;
              c2.vy += impulse * ny;

              // Разделяем круги чтобы не слипались
              const overlap = minDist - distance;
              const separationX = nx * overlap * 0.5;
              const separationY = ny * overlap * 0.5;

              c1.x -= separationX;
              c1.y -= separationY;
              c2.x += separationX;
              c2.y += separationY;
            }
          }
        }
      }
    }

    // Инициализация
    const canvas = document.getElementById('canvas');
    const circles = [];

    // Создаём круги в случайных позициях без перекрытий
    function createCircles() {
      let attempts = 0;
      const maxAttempts = 1000;

      while (circles.length < CONFIG.circleCount && attempts < maxAttempts) {
        const radius = CONFIG.minRadius + Math.random() * (CONFIG.maxRadius - CONFIG.minRadius);
        const x = radius + Math.random() * (window.innerWidth - 2 * radius);
        const y = radius + Math.random() * (window.innerHeight - 2 * radius);
        const color = colors[Math.floor(Math.random() * colors.length)];

        // Проверяем перекрытия с существующими кругами
        let overlaps = false;
        for (const circle of circles) {
          const dx = x - circle.x;
          const dy = y - circle.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < circle.radius + radius + 10) {
            overlaps = true;
            break;
          }
        }

        if (!overlaps) {
          circles.push(new Circle(x, y, radius, color));
        }

        attempts++;
      }
    }

    // Главный цикл анимации
    function animate() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      // Обновляем все круги
      for (const circle of circles) {
        circle.update(width, height);
      }

      // Обрабатываем столкновения
      handleCollisions(circles);

      requestAnimationFrame(animate);
    }

    // Запуск
    createCircles();
    animate();

    // Обработка изменения размера окна
    window.addEventListener('resize', () => {
      // При ресайзе просто продолжаем анимацию, круги будут отскакивать от новых границ
    });
  </script>
</body>
</html>
