<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивные светящиеся сферы</title>
    <style>
        /* Сброс стилей и базовые настройки */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: sans-serif;
            touch-action: none; /* Отключаем зум и скролл на мобильных */
        }

        /* Анимация переливающегося фона */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Контейнер для сфер */
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Общий стиль для сферы */
        .sphere {
            position: absolute;
            border-radius: 50%;
            will-change: transform, background-color;
            cursor: grab;
            user-select: none;
            /* Смешивание цветов для красивого перекрытия */
            mix-blend-mode: screen; 
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.3), 0 0 15px currentColor;
        }

        .sphere:active {
            cursor: grabbing;
        }

        /* Подсказка */
        .hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="canvas"></div>
    <div class="hint">Хватай и бросай сферы • Они живут своей жизнью</div>

    <script>
        /**
         * Конфигурация симуляции
         */
        const CONFIG = {
            count: 20,              // Количество сфер
            minRadius: 20,          // Минимальный радиус (px)
            maxRadius: 60,          // Максимальный радиус (px)
            baseSpeed: 1.5,         // Базовая скорость движения
            friction: 0.995,        // Трение воздуха (замедление)
            elasticity: 0.85,       // Упругость отскока от стен и друг от друга
            colorSpeed: 0.2,        // Скорость смены цвета
            throwForce: 1.2         // Множитель силы броска
        };

        const canvas = document.getElementById('canvas');
        let spheres = [];
        let width, height;

        // Переменные для взаимодействия с мышью/тачем
        let dragSphere = null;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let mouseVX = 0;
        let mouseVY = 0;

        /**
         * Класс Сферы
         */
        class Sphere {
            constructor(id) {
                this.id = id;
                // Случайный размер
                this.radius = CONFIG.minRadius + Math.random() * (CONFIG.maxRadius - CONFIG.minRadius);
                
                // Случайная позиция (чтобы не вылезала за края при создании)
                this.x = this.radius + Math.random() * (window.innerWidth - this.radius * 2);
                this.y = this.radius + Math.random() * (window.innerHeight - this.radius * 2);
                
                // Случайная скорость
                const angle = Math.random() * Math.PI * 2;
                const speed = CONFIG.baseSpeed + Math.random();
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;

                // Цвет (HSL)
                this.hue = Math.random() * 360;
                
                // Создание DOM элемента
                this.el = document.createElement('div');
                this.el.classList.add('sphere');
                this.updateVisuals();
                
                // Настройка размера через CSS (диаметр = радиус * 2)
                // Важно: хитбокс div равен его визуальным размерам
                this.el.style.width = `${this.radius * 2}px`;
                this.el.style.height = `${this.radius * 2}px`;
                
                // Центрирование трансформации относительно левого верхнего угла
                this.el.style.transform = `translate(${this.x}px, ${this.y}px) translate(-50%, -50%)`;

                // Обработчики событий мыши/тача
                this.el.addEventListener('mousedown', this.onPointerDown.bind(this));
                this.el.addEventListener('touchstart', this.onPointerDown.bind(this), { passive: false });

                canvas.appendChild(this.el);
            }

            updateVisuals() {
                this.el.style.backgroundColor = `hsla(${this.hue}, 70%, 60%, 0.6)`;
                this.el.style.color = `hsla(${this.hue}, 70%, 60%, 0.8)`; // Для свечения box-shadow
                this.el.style.boxShadow = `inset 0 0 20px rgba(255,255,255,0.3), 0 0 15px hsla(${this.hue}, 70%, 60%, 0.6)`;
            }

            onPointerDown(e) {
                e.preventDefault();
                dragSphere = this;
                
                // Получаем координаты
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                lastMouseX = clientX;
                lastMouseY = clientY;
                mouseVX = 0;
                mouseVY = 0;

                // Глобальные слушатели для перетаскивания
                document.addEventListener('mousemove', this.onPointerMove);
                document.addEventListener('touchmove', this.onPointerMove, { passive: false });
                document.addEventListener('mouseup', this.onPointerUp);
                document.addEventListener('touchend', this.onPointerUp);
            }

            onPointerMove = (e) => {
                if (!dragSphere) return;
                e.preventDefault();

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                // Вычисляем скорость движения мыши для броска
                mouseVX = (clientX - lastMouseX);
                mouseVY = (clientY - lastMouseY);
                
                lastMouseX = clientX;
                lastMouseY = clientY;

                // Обновляем позицию сферы напрямую за мышкой
                this.x = clientX;
                this.y = clientY;
                
                // Мгновенное обновление DOM
                this.el.style.transform = `translate(${this.x}px, ${this.y}px) translate(-50%, -50%)`;
            }

            onPointerUp = () => {
                if (!dragSphere) return;

                // Применяем импульс броска
                this.vx = mouseVX * CONFIG.throwForce;
                this.vy = mouseVY * CONFIG.throwForce;

                dragSphere = null;
                
                // Удаляем глобальные слушатели
                document.removeEventListener('mousemove', this.onPointerMove);
                document.removeEventListener('touchmove', this.onPointerMove);
                document.removeEventListener('mouseup', this.onPointerUp);
                document.removeEventListener('touchend', this.onPointerUp);
            }

            update() {
                // Если сферу тащат, физику не применяем (позиция задается мышью)
                if (dragSphere === this) return;

                // Применение скорости
                this.x += this.vx;
                this.y += this.vy;

                // Трение (постепенное замедление, но не до нуля благодаря базовой энергии)
                this.vx *= CONFIG.friction;
                this.vy *= CONFIG.friction;

                // Минимальная скорость (чтобы не останавливались совсем)
                const speed = Math.sqrt(this.vx*this.vx + this.vy*this.vy);
                if (speed < 0.5 && speed > 0.01) {
                     // Добавляем немного случайного ускорения если почти остановились
                     this.vx += (Math.random() - 0.5) * 0.1;
                     this.vy += (Math.random() - 0.5) * 0.1;
                }

                // Столкновение со стенами
                // Левая и Правая
                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx = -this.vx * CONFIG.elasticity;
                } else if (this.x + this.radius > width) {
                    this.x = width - this.radius;
                    this.vx = -this.vx * CONFIG.elasticity;
                }

                // Верхняя и Нижняя
                if (this.y - this.radius < 0) {
                    this.y = this.radius;
                    this.vy = -this.vy * CONFIG.elasticity;
                } else if (this.y + this.radius > height) {
                    this.y = height - this.radius;
                    this.vy = -this.vy * CONFIG.elasticity;
                }

                // Смена цвета
                this.hue = (this.hue + CONFIG.colorSpeed) % 360;
                this.updateVisuals();

                // Обновление позиции в DOM
                this.el.style.transform = `translate(${this.x}px, ${this.y}px) translate(-50%, -50%)`;
            }
        }

        /**
         * Проверка и разрешение столкновений между сферами
         * Использует упругое соударение
         */
        function resolveCollisions() {
            for (let i = 0; i < spheres.length; i++) {
                for (let j = i + 1; j < spheres.length; j++) {
                    const s1 = spheres[i];
                    const s2 = spheres[j];

                    // Если одну из сфер тащат, пропускаем расчет физики для пары
                    if (dragSphere === s1 || dragSphere === s2) {
                        continue;
                    }

                    const dx = s2.x - s1.x;
                    const dy = s2.y - s1.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const minDist = s1.radius + s2.radius;

                    if (distance < minDist) {
                        // Вектор нормали столкновения
                        const nx = dx / distance;
                        const ny = dy / distance;

                        // Разделяем сферы, чтобы они не слипались
                        const overlap = minDist - distance;
                        const totalRadius = s1.radius + s2.radius;
                        
                        // Коэффициент разделения пропорционален размеру
                        const k1 = s2.radius / totalRadius;
                        const k2 = s1.radius / totalRadius;

                        s1.x -= nx * overlap * k1;
                        s1.y -= ny * overlap * k1;
                        s2.x += nx * overlap * k2;
                        s2.y += ny * overlap * k2;

                        // Расчет отскока (упругое соударение)
                        const dvx = s2.vx - s1.vx;
                        const dvy = s2.vy - s1.vy;

                        // Скалярное произведение скорости на нормаль
                        const dotProduct = dvx * nx + dvy * ny;

                        // Если сферы уже удаляются друг от друга, ничего не делаем
                        if (dotProduct > 0) continue;

                        // Импульс (масса пропорциональна радиусу)
                        const m1 = s1.radius;
                        const m2 = s2.radius;

                        const impulse = (2 * dotProduct) / (m1 + m2);

                        s1.vx += impulse * m2 * nx * CONFIG.elasticity;
                        s1.vy += impulse * m2 * ny * CONFIG.elasticity;
                        s2.vx -= impulse * m1 * nx * CONFIG.elasticity;
                        s2.vy -= impulse * m1 * ny * CONFIG.elasticity;
                    }
                }
            }
        }

        /**
         * Инициализация
         */
        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            
            if (spheres.length === 0) {
                for (let i = 0; i < CONFIG.count; i++) {
                    spheres.push(new Sphere(i));
                }
            }
        }

        /**
         * Главный цикл анимации
         */
        function animate() {
            // Сначала разрешаем столкновения
            resolveCollisions();

            // Затем обновляем каждую сферу
            spheres.forEach(sphere => sphere.update());

            requestAnimationFrame(animate);
        }

        // Запуск
        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
        });

        init();
        animate();

    </script>
</body>
</html>
