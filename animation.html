<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Анимация кругов с физикой</title>
  <style>
    /* Сброс отступов и настройка холста на весь экран */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      /* Медленно переливающийся тёмный градиентный фон */
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460, #1a1a2e);
      background-size: 400% 400%;
      animation: gradientShift 20s ease infinite;
      font-family: sans-serif;
    }

    /* Анимация плавного переливания фона */
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Контейнер для кругов */
    #container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Общий стиль для всех кругов */
    .circle {
      position: absolute;
      border-radius: 50%;
      will-change: transform, background-color;
      filter: blur(1px);
      mix-blend-mode: screen;
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <script>
    // Настройки симуляции
    const CONFIG = {
      circleCount: 18,              // Количество кругов
      minRadius: 15,                // Минимальный радиус (px)
      maxRadius: 55,                // Максимальный радиус (px)
      minSpeed: 1.8,                // Минимальная начальная скорость
      maxSpeed: 4.5,                // Максимальная начальная скорость
      damping: 0.995,               // Затухание скорости (ближе к 1 = меньше трения)
      elasticity: 0.88,             // Упругость столкновений (0-1)
      colorSpeed: 0.4,              // Скорость смены цвета (градусов в кадр)
      repulsionForce: 0.9,          // Сила отталкивания между кругами
      wallBounce: 0.85              // Упругость отскока от стен
    };

    // Пастельные неоновые цвета (HSL)
    const colors = [
      { h: 180, s: 70, l: 65 },  // бирюзовый
      { h: 280, s: 65, l: 70 },  // фиолетовый
      { h: 340, s: 75, l: 68 },  // розовый
      { h: 45,  s: 80, l: 65 },  // золотистый
      { h: 150, s: 60, l: 62 }   // мятный
    ];

    class Circle {
      constructor(id, x, y, radius, vx, vy, colorIndex) {
        this.id = id;
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.vx = vx;
        this.vy = vy;
        this.colorIndex = colorIndex;
        this.hueOffset = Math.random() * 60; // Индивидуальное смещение оттенка
        this.element = document.createElement('div');
        this.element.className = 'circle';
        this.updateElement();
        document.getElementById('container').appendChild(this.element);
      }

      // Обновление визуального представления круга
      updateElement() {
        const baseColor = colors[this.colorIndex];
        const h = (baseColor.h + this.hueOffset) % 360;
        const { s, l } = baseColor;
        const alpha = 0.55;
        
        this.element.style.width = `${this.radius * 2}px`;
        this.element.style.height = `${this.radius * 2}px`;
        this.element.style.backgroundColor = `hsla(${h}, ${s}%, ${l}%, ${alpha})`;
        this.element.style.boxShadow = `0 0 ${this.radius * 1.8}px hsla(${h}, ${s}%, ${l}%, 0.6)`;
        this.element.style.transform = `translate(${this.x - this.radius}px, ${this.y - this.radius}px)`;
      }

      // Обновление цвета (плавная смена оттенка)
      updateColor() {
        this.hueOffset += CONFIG.colorSpeed;
        if (this.hueOffset > 360) this.hueOffset -= 360;
      }

      // Физическое обновление позиции и обработка столкновений
      update(circles, containerWidth, containerHeight) {
        // Применение скорости к позиции
        this.x += this.vx;
        this.y += this.vy;

        // Затухание скорости (трение)
        this.vx *= CONFIG.damping;
        this.vy *= CONFIG.damping;

        // Столкновение со стенами
        if (this.x - this.radius < 0) {
          this.x = this.radius;
          this.vx = -this.vx * CONFIG.wallBounce;
        } else if (this.x + this.radius > containerWidth) {
          this.x = containerWidth - this.radius;
          this.vx = -this.vx * CONFIG.wallBounce;
        }

        if (this.y - this.radius < 0) {
          this.y = this.radius;
          this.vy = -this.vy * CONFIG.wallBounce;
        } else if (this.y + this.radius > containerHeight) {
          this.y = containerHeight - this.radius;
          this.vy = -this.vy * CONFIG.wallBounce;
        }

        // Столкновения с другими кругами
        for (let other of circles) {
          if (other.id === this.id) continue;

          const dx = other.x - this.x;
          const dy = other.y - this.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          const minDist = this.radius + other.radius;

          // Если круги пересекаются
          if (distance < minDist && distance > 0) {
            // Нормализация вектора столкновения
            const nx = dx / distance;
            const ny = dy / distance;

            // Разница скоростей вдоль нормали столкновения
            const dvx = this.vx - other.vx;
            const dvy = this.vy - other.vy;
            const dvn = dvx * nx + dvy * ny;

            // Если круги уже расходятся, пропускаем
            if (dvn > 0) continue;

            // Импульс столкновения с учётом упругости
            const impulse = -(1 + CONFIG.elasticity) * dvn / 2;
            
            this.vx += impulse * nx * CONFIG.repulsionForce;
            this.vy += impulse * ny * CONFIG.repulsionForce;
            other.vx -= impulse * nx * CONFIG.repulsionForce;
            other.vy -= impulse * ny * CONFIG.repulsionForce;

            // Разделение кругов, чтобы избежать залипания
            const overlap = minDist - distance;
            const separationX = nx * overlap * 0.5;
            const separationY = ny * overlap * 0.5;
            
            this.x -= separationX;
            this.y -= separationY;
            other.x += separationX;
            other.y += separationY;
          }
        }

        // Поддержание минимальной активности
        const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
        if (speed < 0.3) {
          this.vx += (Math.random() - 0.5) * 0.4;
          this.vy += (Math.random() - 0.5) * 0.4;
        }

        this.updateColor();
        this.updateElement();
      }
    }

    // Инициализация симуляции
    let circles = [];
    let containerWidth = window.innerWidth;
    let containerHeight = window.innerHeight;

    function init() {
      circles = [];
      for (let i = 0; i < CONFIG.circleCount; i++) {
        const radius = CONFIG.minRadius + Math.random() * (CONFIG.maxRadius - CONFIG.minRadius);
        const x = radius + Math.random() * (containerWidth - 2 * radius);
        const y = radius + Math.random() * (containerHeight - 2 * radius);
        
        // Случайное направление скорости
        const angle = Math.random() * Math.PI * 2;
        const speed = CONFIG.minSpeed + Math.random() * (CONFIG.maxSpeed - CONFIG.minSpeed);
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;
        
        const colorIndex = Math.floor(Math.random() * colors.length);
        
        circles.push(new Circle(i, x, y, radius, vx, vy, colorIndex));
      }
    }

    // Главный цикл анимации
    function animate() {
      for (const circle of circles) {
        circle.update(circles, containerWidth, containerHeight);
      }
      requestAnimationFrame(animate);
    }

    // Обработка изменения размера окна
    window.addEventListener('resize', () => {
      containerWidth = window.innerWidth;
      containerHeight = window.innerHeight;
    });

    // Запуск
    init();
    animate();
  </script>
</body>
</html>
